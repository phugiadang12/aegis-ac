[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-detection"
version = "0.1.0"
description = "Behavioural cheat detection for Aegis AC"
requires-python = ">=3.12"
dependencies = ["aegis-collector"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["aegis_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
